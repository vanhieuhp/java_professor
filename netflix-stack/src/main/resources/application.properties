spring.application.name=netflix-stack

# --- Redis ---------------------------------------------------------------
# Kho trạng thái dùng chung cho cửa sổ trượt. Không phải cache, không phải kho
# session: nếu Redis mất dữ liệu thì cửa sổ mất theo và cảnh báo bị bỏ sót
# trong im lặng. Cấu hình bền vững của Redis là một quyết định kiến trúc, không
# phải chi tiết vận hành.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=200ms

# Timeout 200ms là có chủ đích, không phải số đẹp. Ngân sách độ trễ của luật là
# vài mili-giây; một lệnh Redis mất tới 200ms nghĩa là có chuyện, và hỏng nhanh
# tốt hơn treo. Tuần 03 sẽ cho bạn số thật để chỉnh lại con số này.

# --- Cửa sổ trượt --------------------------------------------------------
# Tham số nghiệp vụ, để ngoài code vì đội rủi ro cần đổi mà không chờ deploy.
netflix-stack.window.duration=5m
netflix-stack.window.count-threshold=10
netflix-stack.window.amount-threshold=50000000
netflix-stack.window.key-ttl=15m

# key-ttl dài hơn window: ví hoạt động liên tục phải được gia hạn sau MỖI giao
# dịch, nếu không key hết hạn giữa lúc cửa sổ đang mở. Ví ngừng hoạt động thì tự
# biến mất — vừa dọn rác, vừa chống rò rỉ bộ nhớ với hàng triệu ví ngủ.

