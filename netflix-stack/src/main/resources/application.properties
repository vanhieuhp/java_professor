spring.application.name=netflix-stack

# --- Redis ---------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=200ms

netflix-stack.window.duration=5m
netflix-stack.window.count-threshold=10
netflix-stack.window.amount-threshold=50000000
netflix-stack.window.key-ttl=15m

netflix-stack.counter.server-count=3
netflix-stack.counter.flush-interval-ms=100
netflix-stack.counter.max-pending=2000
netflix-stack.counter.circuit-breaker.failure-rate-threshold=50
netflix-stack.counter.circuit-breaker.wait-duration-in-open-state-ms=2000
netflix-stack.counter.circuit-breaker.permitted-calls-in-half-open=3
netflix-stack.counter.circuit-breaker.sliding-window-size=10
netflix-stack.counter.chaos.call-timeout-ms=300

# --- Cassandra (event log) ------------------------------------------------
spring.cassandra.contact-points=localhost:9042
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.keyspace-name=counter_lab

netflix-stack.counter.rollup.lag-millis=1000
logging.level.hieunv.dev.netflixstack.counter.rollup=DEBUG

netflix-stack.counter.rollup.max-lookback-hours=24
netflix-stack.counter.reader.cache-ttl=5s
