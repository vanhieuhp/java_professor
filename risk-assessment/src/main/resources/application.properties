spring.application.name=risk-assessment

spring.datasource.url=jdbc:postgresql://localhost:5432/pcrt
spring.datasource.username=pcrt_user
spring.datasource.password=pcrt_user

# Flyway la nguon chan ly duy nhat cua schema. Hibernate chi validate, khong tu sinh bang.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
# Job dong bo ghi ca dong moi lan dong cu trong cung mot trang. Khong gom UPDATE lai theo
# bang thi Hibernate gui xen ke INSERT/UPDATE va batch bi cat vun - batch_size=500 o tren
# chi co tac dung day du khi ca hai loai cau deu duoc gom.
spring.jpa.properties.hibernate.order_updates=true

# ---- Redis: cache du lieu danh sach dung chung giua cac instance ----
# Cong 6381, khong phai 6379: 6379 dang bi container Redis cua project khac giu, 6380 la cua
# pcrt-lab. Xem docker/docker-compose.yml.
spring.data.redis.host=localhost
spring.data.redis.port=6381
# Timeout ngan co chu y: Redis o day la cache, duong du phong la doc thang Postgres. Cho
# Lettuce treo lau hon nghia la mot lan Redis cham keo theo ca vong quet cham theo.
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=1s

pcrt.watchlist-cache.redis-key=pcrt:watchlist:snapshot
# TTL chi de don key mo coi. Cai quyet dinh cache con dung hay khong la moc entries_changed_at
# — xem Javadoc BlackListServiceImpl.
pcrt.watchlist-cache.redis-ttl-hours=24

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Nhieu tac vu nen chay song song: cron TH3, job gui Core, detector DS den, refresh cache.
# Pool mac dinh cua Spring la 1 thread - mot lan gui Core cham se chan tat ca cac tac vu con lai.
spring.task.scheduling.pool.size=4

# Core vi gia. Dat false khi tro sang Core that (doi ca core.base-url trong bang pcrt_config).
pcrt.mock-core.enabled=true

# ---- Kafka: Core publish su kien doi thong tin KH ----
# Cong 9094, khong phai 9092: pcrt-lab da giu 9092. Xem docker/docker-compose.yml.
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=pcrt-cif

# earliest: consumer group moi phai doc tu dau topic. Bo qua nhung su kien co truoc luc
# service khoi dong nghia la bo sot khach hang can ra soat - khong chap nhan duoc.
spring.kafka.consumer.auto-offset-reset=earliest

# TAT auto-commit. Mot dong config, va no la ranh gioi giua "mat su kien khi crash" va khong
# mat: auto-commit day offset theo dong ho BAT KE da xu ly xong hay chua.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual_immediate

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# acks=all: producer chi coi la gui thanh cong khi moi replica trong ISR da nhan.
spring.kafka.producer.acks=all

pcrt.topic.customer-changed=core.customer.changed

# Khong khai bao spring.jackson.deserialization.read-unknown-enum-values-as-null: Jackson 3
# da BO feature do khoi DeserializationFeature, va khai bao no lam app khong khoi dong duoc.
# Viec doc changeType la nay nam o ChangeType.fromJson - xem Javadoc o do.
