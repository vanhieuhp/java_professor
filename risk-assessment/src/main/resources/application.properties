spring.application.name=risk-assessment

# config/PcrtDataSourceConfig
spring.datasource.url=jdbc:postgresql://localhost:5432/pcrt
spring.datasource.username=pcrt_user
spring.datasource.password=pcrt_user
spring.datasource.hikari.pool-name=pcrt-pool
spring.datasource.hikari.maximum-pool-size=10

# config/CoreDataSourceConfig - read only
core.datasource.url=${CORE_DB_URL:jdbc:mariadb://10.100.172.128:3306/wallet_core_dev}
core.datasource.username=${CORE_DB_USERNAME:wallet}
core.datasource.password=${CORE_DB_PASSWORD:bgLGLY3NF4}
core.datasource.driver-class-name=org.mariadb.jdbc.Driver
core.datasource.hikari.pool-name=core-pool
core.datasource.hikari.maximum-pool-size=5
core.datasource.hikari.read-only=true
core.datasource.hikari.initialization-fail-timeout=-1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=1s

pcrt.watchlist-cache.redis-key=pcrt:watchlist:snapshot
pcrt.watchlist-cache.redis-ttl-hours=24

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.task.scheduling.pool.size=4

# ---- Kafka ----
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=pcrt-cif
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual_immediate

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

pcrt.topic.customer-changed=core.customer.changed

